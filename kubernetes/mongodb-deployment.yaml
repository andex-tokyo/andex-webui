apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: librechat
  labels:
    app: mongodb
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.34
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: librechat-secrets
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data-pvc
