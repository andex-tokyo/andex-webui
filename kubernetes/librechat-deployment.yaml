# kubernetes/librechat-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: librechat
  labels:
    app: librechat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      containers:
        - name: librechat
          image: ghcr.io/danny-avila/librechat:v0.8.5
          ports:
            - containerPort: 3080
              protocol: TCP
          envFrom:
            - secretRef:
                name: librechat-secrets
          env:
            - name: DOMAIN_CLIENT
              value: "https://ai.andex.tokyo/"
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: APP_TITLE
              value: "Akihabara AI Chat"
            - name: ENDPOINTS
              value: "google,bedrock,openAI"
            - name: BEDROCK_AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: BEDROCK_AWS_MODELS
              value: "us.amazon.nova-2-lite-v1:0,amazon.nova-pro-v1:0,us.amazon.nova-premier-v1:0,anthropic.claude-opus-4-7,anthropic.claude-sonnet-4-6,anthropic.claude-haiku-4-5-20251001-v1:0"
            - name: GOOGLE_MODELS
              value: "gemini-3-flash-preview,gemini-3.1-pro-preview,gemini-3.1-flash-lite"
            - name: OPENAI_MODELS
              value: "gpt-5.4-mini,gpt-5.5"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: librechat-data
              mountPath: /app/data
      volumes:
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data-pvc
