# kubernetes/librechat-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: librechat
  labels:
    app: librechat
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      containers:
        - name: librechat
          image: ghcr.io/danny-avila/librechat:v0.8.7
          ports:
            - containerPort: 3080
              protocol: TCP
          envFrom:
            - secretRef:
                name: librechat-secrets
          env:
            - name: DOMAIN_CLIENT
              value: "https://ai.andex.tokyo/"
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: APP_TITLE
              value: "Akihabara AI Chat"
            - name: ENDPOINTS
              value: "google,openAI"
            - name: GOOGLE_MODELS
              value: "gemini-3.7-flash,gemini-3.1-pro-preview,gemini-3.5-flash-lite"
            - name: OPENAI_MODELS
              value: "gpt-5.6-luna,gpt-5.6"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: librechat-data
              mountPath: /app/data
      volumes:
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data-pvc
